packages:
  - "apps/*"
  - "packages/*"
allowBuilds:
  '@nestjs/core': true
  '@prisma/client': true
  '@prisma/engines': true
  '@swc/core': true
  esbuild: true
  prisma: true
  # BullMQ'ning ixtiyoriy native tezlashtirgichi: kerak emas, JS fallback ishlaydi
  msgpackr-extract: false
overrides:
  # @nestjs/platform-fastify o'z fastify nusxasini olib keladi: xavfsizlik yamoqlari bor versiyaga majburlaymiz
  fastify: ^5.12.8
