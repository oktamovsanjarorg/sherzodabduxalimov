<!doctype html>
<html lang="uz">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0b3b36" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Admin · Ona tili</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <script>
      // Telegram Mini App ichida ochilgan bo'lsa (ilova havolasi #tgWebApp... parametrlari bilan keladi), Telegram skriptini yuklaymiz.
      // Oddiy brauzerda yuklanmaydi. Belgi sessiya davomida saqlanadi (sahifa yangilansa ham)
      (function () {
        try {
          if (/tgWebApp/.test(location.hash)) sessionStorage.setItem("onatili-in-tg", "1");
          if (sessionStorage.getItem("onatili-in-tg")) document.write('<script src="https://telegram.org/js/telegram-web-app.js"><\/script>');
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <!-- Kod yuklanguncha to'q yashil ekran (Mini App'dan o'tishda oq "chaqnash" bo'lmasin). React uni almashtiradi -->
    <div id="root"><div style="position: fixed; inset: 0; background: #0b3b36"></div></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
