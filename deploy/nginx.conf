server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # Asl IP'ni mb-caddy'dan olamiz
    set_real_ip_from 172.16.0.0/12;
    real_ip_header X-Forwarded-For;

    client_max_body_size 20m;

    location /api/ {
        proxy_pass http://onatili-api:4100;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    # Shifrlangan HLS segmentlari: faqat seg_NNNN.ts. Kalit (enc.key) va boshqa fayllar hech qachon berilmaydi.
    location ~ "^/media-files/v/([a-z0-9]{20,40})/(1080p|720p|480p|360p)/(seg_[0-9]{4,6}\.ts)$" {
        alias /data/media/videos/$1/hls/$2/$3;
        add_header Cache-Control "public, max-age=31536000, immutable";
        types { }
        default_type video/mp2t;
    }
    location /media-files/ {
        return 404;
    }

    # Vite xeshlangan fayllari: uzoq muddat keshlanadi
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # SPA: index.html keshlanmaydi, shunda yangi versiya darhol chiqadi
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }
}
